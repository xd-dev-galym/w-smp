<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WardenSMP — сервер Minecraft</title>
  <meta name="description" content="WardenSMP: анархичное выживание, продуманная экономика и привилегии. IP: mc.w-smp.in">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body data-root="" data-page="home">

<div id="site-header"></div>

<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <h1>Лучший сервер для твоих приключений</h1>
        <p>Анархичное выживание без лишних ограничений, продуманная экономика и администрация, которая всегда выходит на связь.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#shop">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            Перейти к товарам
          </a>
          <button class="btn btn-dark" type="button" data-copy="mc.w-smp.in" aria-label="Скопировать IP-адрес сервера">
            <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>
            <span class="t">mc.w-smp.in</span>
          </button>
        </div>
      </div>
      <!-- Справа место под персонажа: добавь сюда <img src="img/character.png" alt=""> -->
      <div class="hero-art">
        <div class="sonar" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="wrap">
      <h2>Ассортимент</h2>
      <p class="cat-label">Категории</p>
      <div class="cats"><button class="cat" type="button" aria-pressed="true">Привилегии</button></div>
      <div class="grid" id="products"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
